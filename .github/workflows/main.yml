# GitHub Action for generating a contribution graph with a snake eating your contributions.
# GitHub katkı grafiğinizi yiyen bir yılanla katkı grafiği oluşturan iş akışı.
name: Generate Snake

# Bu Action her 6 saatte bir otomatik olarak çalışacaktır.
on:
  schedule:
      # Her 6 saatte bir çalıştır.
    - cron: "0 */6 * * *"

# Bu komut, Actions sekmesinden manuel olarak çalıştırmanıza olanak tanır.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

    # Deponuza erişmek için çekme (checkout) işlemi.
      - uses: actions/checkout@v2

    # Yılanı oluşturan Action.
      - uses: Platane/snk@v3 # En güncel ve set-output uyarısını çözülmüş versiyon
        id: snake-gif
        with:
          # KULLANICI ADI DÜZELTİLDİ: Senin GitHub kullanıcı adın.
          github_user_name: karadagabdi 
          # Dosyaların nereye kaydedileceğini belirtir.
          gif_out_path: dist/github-contribution-grid-snake.gif
          svg_out_path: dist/github-contribution-grid-snake.svg

     # Hata ayıklama için git durumunu gösterir.
      - run: git status

      # Değişiklikleri ana dala (branch) iter.
      - name: Push changes
        uses: ad-m/github-push-action@master
        with:
          # Gerekli izinleri sağlayan token.
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # DAL (BRANCH) DÜZELTİLDİ: Ana dal (branch) adını 'main' olarak ayarladık.
          branch: main 
          force: true

      - uses: crazy-max/ghaction-github-pages@v2.1.3
        with:
          # Çıktı klasörünü GitHub Pages için hazırlayan Action.
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
